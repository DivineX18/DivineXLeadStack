services:
  - type: web
    name: ascend-crm
    runtime: node
    # 1 CPU / 2 GB. This service was on `starter` (0.5 CPU / 512 MB) and the
    # process was being OOM-killed roughly every 2.5 hours: two unexplained
    # restarts on an unchanged commit (2026-10-11 22:36:59 and 2026-10-12
    # 01:07:55 UTC), each surfacing to users as a Cloudflare 502 and, mid-
    # navigation, as "Application error: a client-side exception" when a JS
    # chunk request landed in the restart window.
    #
    # 512 MB was never enough for this app: a 385 MB build with 283 API routes
    # and 191 pages, where Next loads route modules lazily and keeps them, so
    # RSS climbs as the app is used until the container ceiling is hit.
    #
    # This service is Blueprint managed, so THIS LINE is the source of truth —
    # changing the plan only in the Render dashboard gets reverted on the next
    # blueprint sync. Values are Render's compute-plan identifiers (see the
    # Compute section of the service page); `starter` is the legacy name for
    # 0.5c-512mb.
    plan: 1c-2g
    branch: main
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    domains:
      - crm.divinex.io
      # Ascend OS unification (docs/architecture/ASCEND_OS_V1_ARCHITECTURE_SPECIFICATION.md,
      # "Customer-Facing Product"): app.divinex.io and crm.divinex.io are
      # the SAME Next.js app, not two deployments — decide-shell-mode.ts
      # picks "full_ascend" vs "crm_only" per-request based on which
      # hostname the caller used, plus entitlements/flags. Do not move this
      # domain to a different service.
      - app.divinex.io
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_APP_URL
        value: https://crm.divinex.io
      # Ascend OS domain cutover (2026-08-08): the Funnels custom-domain
      # middleware (src/middleware.ts::customDomainRewrite()) treats any
      # hostname other than NEXT_PUBLIC_APP_URL's as an unrecognized tenant
      # custom domain and rewrites it into a 404 Firestore lookup — a
      # fail-closed guard from a past incident. app.divinex.io is a second
      # first-party hostname for this SAME app (see the domains: block
      # above), not a tenant's funnel domain, so it must be allowlisted here
      # or every request to it 404s despite reaching the right service.
      - key: SAFE_APP_HOSTNAMES
        value: app.divinex.io
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: hello@divinex.io
      - key: EMAIL_FROM
        # notifications@divinex.io only — crm.divinex.io is NOT a verified
        # Resend sending domain (confirmed via resend.domains.list()); only
        # the apex divinex.io is. This committed value previously lagged
        # the live Render dashboard value, which was corrected manually;
        # this keeps the source of truth in sync with production.
        value: "Flow <notifications@divinex.io>"
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_ADMIN_PROJECT_ID
        sync: false
      - key: FIREBASE_ADMIN_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_ADMIN_PRIVATE_KEY
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false
      - key: COOKIE_SECRET_CURRENT
        sync: false
      - key: COOKIE_SECRET_PREVIOUS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: QSTASH_URL
        sync: false
      - key: QSTASH_TOKEN
        sync: false
      - key: QSTASH_CURRENT_SIGNING_KEY
        sync: false
      - key: QSTASH_NEXT_SIGNING_KEY
        sync: false
      - key: AUTOMATIONS_TOKEN_SECRET
        sync: false
      # Shared with the divinex.io website service (same value): verifies the signed visitor IP
      # on hosted-form submissions (src/lib/forms/client-ip.ts).
      - key: FLOW_FORM_PROXY_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Stock photography for generated landing pages (lib/funnels/imagery.ts).
      # Absent here until now, which is why every page generated on a
      # DEPLOYMENT rendered with zero images while working locally: the key
      # lives in .env.local and was never carried into Render. Set the value in
      # the dashboard (sync: false keeps it out of the repo). Without it the
      # media planner still runs and still reasons, it simply resolves every
      # slot to "no image" and the page composes text-led.
      - key: PEXELS_API_KEY
        sync: false
      # Ascend OS Phase 2, Slice 9/10.5 — Intelligence Bridge client
      # (src/lib/intelligence/ascend-intelligence-client.ts). URL must
      # include the /api prefix since the client appends
      # /internal/intelligence/... directly. Secret must match
      # ASCEND_INTELLIGENCE_API_SECRET on the Ascend
      # (DivineX-Business-Intelligence) side exactly. Points at that
      # service's own Render-assigned URL — it's internal infrastructure,
      # not a customer-facing product, so it deliberately has no custom
      # domain. app.divinex.io and crm.divinex.io are the only two
      # customer-facing domains, both served by this app.
      - key: ASCEND_INTELLIGENCE_API_URL
        value: https://divinex-business-intelligence.onrender.com/api
      # The SSO exchange leg. Explicit here so it deploys with the service
      # rather than depending on a dashboard value that has drifted before;
      # lib/auth/ascend-exchange-url.ts additionally refuses a localhost
      # value, because that drift took Operations down in production.
      - key: ASCEND_SSO_EXCHANGE_URL
        value: https://divinex-business-intelligence.onrender.com/api/sso/operations/exchange
      - key: ASCEND_INTELLIGENCE_API_SECRET
        sync: false
      # Google Analytics / Search Console connection (Growth Intelligence).
      #
      # DECLARED HERE because this service is Blueprint managed: render.yaml
      # is the source of truth for its environment, and keys set only in the
      # dashboard are at the mercy of the next sync. Losing these would break
      # every customer's Google connection in a way that looks like Google's
      # fault, not ours.
      #
      # `sync: false` on all three: Render keeps the dashboard value and the
      # blueprint stops competing for it. The client SECRET must never be in
      # the repo, and the other two are deployment-specific, so none of their
      # values belong in version control either.
      #
      # Expected values, for whoever sets them:
      #   GOOGLE_OAUTH_CLIENT_ID     <id>.apps.googleusercontent.com
      #   GOOGLE_OAUTH_CLIENT_SECRET GOCSPX-…
      #   GOOGLE_OAUTH_REDIRECT_URI  https://app.divinex.io/api/google/callback
      #     — explicit, NOT derived from NEXT_PUBLIC_APP_URL, which is
      #       crm.divinex.io while customers connect from app.divinex.io, and
      #       it must match a redirect URI registered in Google Cloud exactly.
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      # GOOGLE_ADS_DEVELOPER_TOKEN is DEPRECATED and deliberately unset.
      #
      # Google sunset developer tokens on 9 September 2026: Ads API access now
      # attaches to the Google Cloud project that owns GOOGLE_OAUTH_CLIENT_ID
      # above, and a token in the request header is "optional and ignored by
      # the API servers". It is kept declared so a deployment that still has a
      # value set is not reported as unknown by `pnpm doctor`; nothing reads
      # it. Do not set it, and do not treat its absence as the reason Ads is
      # not working.
      #
      # This comment previously said the connect route DROPS Ads from the
      # consent request without the token. That was true and is why Ads could
      # never be granted on any deployment; the gate is gone.
      - key: GOOGLE_ADS_DEVELOPER_TOKEN
        sync: false
      # GOOGLE_ADS_LOGIN_CUSTOMER_ID is the DivineX Ads MANAGER account id,
      # ten bare digits, no dashes. Needed only to reach a client account
      # THROUGH the manager: it names the hierarchy a request is authorized
      # under. It is NOT the target customer id, NOT a consent precondition,
      # and NOT used by customers:listAccessibleCustomers, which ignores it.
      # An account shared directly with the connecting user needs no manager,
      # so absent is a valid state. Value stays in the dashboard.
      - key: GOOGLE_ADS_LOGIN_CUSTOMER_ID
        sync: false
